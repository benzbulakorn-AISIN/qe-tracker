<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCR In-house Log Sheet · QE Electronics</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--line:#e3e6eb;--line2:#cfd5de;--txt:#1f2937;--mut:#5b6472;--soft:#f6f7f9;--soft2:#eef1f5;
  --pri:#2563eb;--pri-d:#1d4ed8;--on-pri:#fff;--ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--dang:#b91c1c;--dang-bg:#fee2e2;--info:#1d4ed8;--info-bg:#dbeafe;--gray-bg:#e5e7eb;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r1:6px;--r2:8px;--r3:12px;--sh:0 1px 2px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",Tahoma,"Noto Sans Thai",sans-serif}
a{color:var(--pri)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- header ---------- */
.hd{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.hd-in{max-width:1480px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;min-width:0}
.brand b{font-size:18px}.brand small{color:var(--mut);font-size:12px}
.brand a{text-decoration:none;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:6px 14px;border-radius:var(--r2);border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri-d)}
.btn.d{color:var(--dang);border-color:#f3b4b4}.btn.d:hover{background:var(--dang-bg)}
.btn.s{min-height:30px;padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:3px 12px;border-radius:99px;border:1px solid var(--line);background:var(--soft);font-size:12px;font-weight:700}
.pill i{width:9px;height:9px;border-radius:50%;background:#9ca3af;display:inline-block}
.pill.ok i{background:#22c55e}.pill.err i{background:#ef4444}.pill.busy i{background:#f59e0b}
.me{min-height:34px;padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff}
/* ---------- layout ---------- */
main{max-width:1480px;margin:auto;padding:16px}
.banner{margin:0 0 12px;padding:10px 14px;border-radius:var(--r2);border:1px solid var(--line2);background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);border-color:#f5d28a}.banner.info{background:var(--info-bg);border-color:#9ec1f7}.banner.err{background:var(--dang-bg);border-color:#f3b4b4}
.banner .grow{flex:1;min-width:200px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--mut);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:10px 14px;text-align:left;box-shadow:var(--sh)}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--pri)}
.kpi.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{color:var(--mut);font-size:13px}
.kpi.late b{color:var(--dang)}.kpi.soon b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:14px 16px;box-shadow:var(--sh);margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input[type=search],.bar select{min-height:34px;padding:4px 10px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff}
.bar input[type=search]{min-width:220px;flex:1;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--soft);font-size:12px;font-weight:700;white-space:nowrap}
button.chip{cursor:pointer;min-height:28px}button.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.late{background:var(--dang-bg);border-color:#f3b4b4;color:var(--dang)}
.chip.soon{background:var(--warn-bg);border-color:#f5d28a;color:var(--warn)}
.chip.ok{background:var(--ok-bg);border-color:#a7e3b9;color:var(--ok)}
.chip.info{background:var(--info-bg);border-color:#9ec1f7;color:var(--info)}
.chip.gray{background:var(--gray-bg);color:#374151}
.af{font-size:12px;color:var(--mut)}
/* ---------- table ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r3);background:#fff;box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:2;background:var(--soft2);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover>td{background:#f8fafc}
tr.row{cursor:pointer}
td.n a{font-weight:800;text-decoration:none}
td small{display:block;color:var(--mut);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.tag.late{background:var(--dang-bg);color:var(--dang)}.tag.soon{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:var(--info-bg);color:var(--info)}.tag.done{background:var(--ok-bg);color:var(--ok)}.tag.hold{background:var(--gray-bg);color:#374151}.tag.cancel{background:var(--gray-bg);color:#6b7280;text-decoration:line-through}
.stp{display:flex;gap:3px;align-items:center}
.stp i{width:16px;height:7px;border-radius:4px;background:var(--line2);display:inline-block}
.stp i.d{background:#86b3f7}.stp i.c{background:var(--pri)}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:4px}
/* ---------- dept matrix ---------- */
.dm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dm button{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:8px 12px;text-align:left}
.dm button:hover{border-color:var(--pri)}.dm button.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.dm b{font-size:13px}.dm .n{font-size:22px;font-weight:800;line-height:1.1;margin-top:2px}.dm small{color:var(--mut);font-size:12px;display:block}
.dm .n.late{color:var(--dang)}
/* ---------- detail ---------- */
.dh{background:#fff;border:1px solid var(--line);border-radius:var(--r3);padding:12px 16px;margin-bottom:12px;box-shadow:var(--sh);position:sticky;top:58px;z-index:40}
.dh-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dh-top h1{margin:0;font-size:20px}
.dh-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dirty{font-size:12px;font-weight:700;color:var(--warn)}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stg button{border:1px solid var(--line2);background:#fff;border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;min-height:28px}
.stg button.past{background:var(--info-bg);border-color:#9ec1f7;color:var(--info)}
.stg button.cur{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid transparent;border-bottom:0;background:transparent;padding:8px 14px;font-weight:700;border-radius:var(--r2) var(--r2) 0 0;color:var(--mut);min-height:38px}
.tabs button.on{background:#fff;border-color:var(--line);color:var(--txt);box-shadow:0 2px 0 #fff}
.tabs button .bd{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:99px;background:var(--gray-bg);font-size:11px}
.tabs button .bd.late{background:var(--dang-bg);color:var(--dang)}.tabs button .bd.warn{background:var(--warn-bg);color:var(--warn)}
details.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r3);margin-bottom:12px;box-shadow:var(--sh)}
details.sec>summary{cursor:pointer;padding:12px 16px;font-weight:800;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸';color:var(--mut)}details.sec[open]>summary::before{content:'▾'}
details.sec>.in{padding:4px 16px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.grid .w2{grid-column:span 2}.grid .w3{grid-column:1/-1}
.f label,.f .lb{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:0 0 3px}
.f label .req{color:var(--dang)}
.f input[type=text],.f input[type=date],.f input[type=url],.f select,.f textarea,.cell{width:100%;min-height:34px;padding:5px 9px;border:1px solid var(--line2);border-radius:var(--r2);background:#fff}
.f textarea,textarea.cell{min-height:64px;resize:vertical}
.f .hint{font-size:12px;color:var(--mut);margin-top:2px}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--dang);background:#fff7f7}
.f .err{font-size:12px;color:var(--dang);margin-top:2px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px}
.cats label{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r2);background:#fff;font-size:13px;cursor:pointer}
.cats label:has(input:checked){border-color:var(--pri);background:var(--info-bg)}
.cats input{margin-top:3px;width:16px;height:16px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.chk input{width:16px;height:16px}
.rv{display:grid;grid-template-columns:70px 120px 1fr 120px;gap:8px;align-items:center;margin-bottom:6px}
.rv b{font-size:13px}
/* checklist */
.dg{margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:var(--r3);overflow:hidden}
.dg>header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--soft2);border-bottom:1px solid var(--line)}
.dg>header h3{margin:0}.dg>header .grow{flex:1}
.dg>header .bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dg>header .bulk input{min-height:30px;padding:2px 8px;border:1px solid var(--line2);border-radius:var(--r1);width:120px}
.tw2{overflow:auto}
.ck{min-width:1020px}
.ck td{padding:6px 8px}
.ck .no{width:46px;font-weight:700;color:var(--mut)}
.ck .nm{min-width:240px;max-width:340px}
.ck .doc{min-width:200px}.ck .doc .cell+.cell{margin-top:4px;font-size:12px}
.ck .pic{width:110px}.ck .dt{width:138px}.ck .st{width:128px}.ck .qs{width:76px}.ck .rm{min-width:170px}
.ck tr.late>td{background:#fff5f5}.ck tr.done>td{background:#f4fbf6}
.ck .rev{display:inline-block;margin-top:2px;font-size:11px;font-weight:800;padding:0 6px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.ck .old{font-size:11px;color:var(--mut);text-decoration:line-through;display:block}
.cell{min-height:32px;padding:3px 7px;font-size:13px}
.open-ic{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;border:1px solid var(--line2);border-radius:var(--r1);background:#fff;text-decoration:none;font-size:14px}
/* cards (risk / mom) */
.ic{background:#fff;border:1px solid var(--line);border-radius:var(--r3);margin-bottom:12px;box-shadow:var(--sh)}
.ic>header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.ic>header b{font-size:14px}.ic>header .grow{flex:1}
.ic>.in{padding:12px 14px}
.grp{margin:10px 0 4px;font-size:12px;font-weight:800;color:var(--mut);text-transform:none}
.kd{min-width:780px}
.hist{font-size:12px;color:var(--mut)}
.dsum{width:100%}
.dsum td,.dsum th{padding:7px 10px}
.dsum .num{text-align:right;font-variant-numeric:tabular-nums}
.pl{font-size:12px;color:var(--mut)}
.log li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.log time{color:var(--mut);font-size:12px;margin-right:8px}
ul{margin:0;padding-left:18px}ul.log{list-style:none;padding:0}
/* modal + toast */
.mo{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.md{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md.w{max-width:820px}
.md h2{margin-bottom:10px}.md .act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.md pre{background:var(--soft);padding:10px;border-radius:var(--r2);overflow:auto;font-size:12px;max-height:240px;white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:300;background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.err{background:#991b1b}
.sticky-save{position:sticky;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 16px;margin:0 -16px;display:none;gap:10px;align-items:center}
.sticky-save.on{display:flex}
.legend{font-size:12px;color:var(--mut);margin:0 0 10px}
@media(max-width:900px){
  main{padding:10px}
  .grid .w2{grid-column:1/-1}
  .rv{grid-template-columns:60px 1fr}
  .dh{position:static}
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:8px solid var(--bg);padding:6px 0}
  table.stack td{border:0;padding:3px 12px}
  table.stack td::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:var(--mut)}
  table.stack td.n::before{display:none}
}
@media print{.hd,.tabs,.dh-act,.sticky-save,.btn{display:none!important}body{background:#fff}.dh{position:static;box-shadow:none}details.sec{break-inside:avoid}details.sec>*{display:block}}

</style>
</head>

async function api(method,query,body,extra){

  const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/'+(cfg.table||'pcr_records')+(query||''),{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store',mode:'cors'});
  const t=await r.text(); usage(t.length); let j=null; try{j=t?JSON.parse(t):null;}catch(e){j=null;}
  if(!r.ok){const e=new Error((j&&(j.message||j.hint))||('HTTP '+r.status));e.status=r.status;e.code=j&&j.code;throw e;}
  return j;
}

  p.actions=Array.isArray(p.actions)?p.actions:[]; p.mom=Array.isArray(p.mom)?p.mom:[]; p.log=Array.isArray(p.log)?p.log:[];

function applicable(p){
  const sel=new Set((p.cats||[]).map(Number)), out=[];
  PREP.forEach(it=>{ if(it.head) return; const d=p.prep[it.no]||{}; const app=it.app&&it.app.some((v,i)=>v&&sel.has(i+1)); const has=!!(d.doc||d.url||d.pic||d.plan||d.actual||d.status||d.remark); if(app||has) out.push({it,d,extra:!app}); });
  return out;
}
const isOpen=st=>st!=='O'&&st!=='NA';
function openStats(p){
  const pd={},pt={},ad=[],kd=[];
  DORDER.forEach(k=>{pt[k]=[0,0];pd[k]=[];});
  applicable(p).forEach(({it,d})=>{ const k=it.dept==='ALL'?'OWN':it.dept; if(!pt[k]){pt[k]=[0,0];pd[k]=[];} if(d.status==='NA') return; pt[k][0]++; if(d.status==='O') pt[k][1]++; else pd[k].push(d.plan||''); });
  (p.actions||[]).forEach(a=>{ if(isOpen(a.status)) ad.push(a.due||''); });
  (p.risk||[]).forEach(r=>{ if(isOpen(r.status)&&(r.point||r.detail)) ad.push(r.due||''); });
  (p.mom||[]).forEach(m=>(m.items||[]).forEach(i=>{ if(i.status!=='Done') kd.push(i.due||''); }));
  return {pd,pt,ad,kd};
}
function buildSummary(p){

  Object.keys(o.pt).forEach(k=>{if(o.pt[k][0])ptOut[k]=o.pt[k];});
  const ap=applicable(p).filter(x=>x.d.status!=='NA'), completed=ap.filter(x=>x.d.status==='O').length;
  const overdue=ap.filter(x=>isOpen(x.d.status)&&isISO(x.d.plan)&&diffDays(x.d.plan)<0).length;
  const noPlanN=ap.filter(x=>isOpen(x.d.status)&&!x.d.plan).length;
  const openActions=(p.actions||[]).filter(a=>isOpen(a.status));
  const overdueActions=openActions.filter(a=>isISO(a.due)&&diffDays(a.due)<0).length;
  const momItems=(p.mom||[]).flatMap(m=>m.items||[]),openMom=momItems.filter(i=>i.status!=='Done');
  const overdueMom=openMom.filter(i=>isISO(i.due)&&diffDays(i.due)<0).length;
  return {n:p.pcrNo,d:clip(p.detail,160),l:p.lineNo,o:p.owner,dp:p.issueDept,q:p.qe,st:p.stage|0,as:p.as||'active',sop:p.sop||'',qs:p.qsDate||'',da:p.dmgmDate||'',fd:p.finalDue||'',aad:p.allActDue||'',aj:p.dmgmJudge||'',ra:p.remainingAction||'',reg:p.regDate||'',momQ:!!p.momByQe,cats:(p.cats||[]).map(Number),form:!!(p.formLink&&p.formLink.trim()),pd:pdOut,pt:ptOut,ad:o.ad.slice().sort(),kd:o.kd.slice().sort(),checkTotal:ap.length,checkDone:completed,checkPending:Math.max(0,ap.length-completed),checkOverdue:overdue,checkNoPlan:noPlanN,checkPct:ap.length?Math.round(completed*100/ap.length):0,openAction:openActions.length,overdueAction:overdueActions,momCount:(p.mom||[]).length,openMom:openMom.length,overdueMom:overdueMom};
}

function nextDue(s){const d=allDates(s).filter(isISO).sort();return d[0]||'';}
function noPlan(s){let n=0;Object.values(s.pd||{}).forEach(x=>x.forEach(v=>{if(!v)n++;}));return n;}
function health(s){
  if(s.as==='cancel')return {k:'cancel',t:'Cancelled / ยกเลิก',i:'✕',sev:9};
  if(s.as==='hold')return {k:'hold',t:'Hold / พักไว้',i:'⏸',sev:8};
  if((s.st|0)>=6)return {k:'done',t:'Closed / ปิดแล้ว',i:'✓',sev:7};
  if(s.aj==='Not pass')return {k:'late',t:'Not pass',i:'✕',sev:0};
  const ds=allDates(s).filter(isISO).map(diffDays);
  if(ds.some(x=>x<0))return {k:'late',t:'Overdue / ล่าช้า',i:'⚠',sev:0,n:ds.filter(x=>x<0).length};
  if(ds.some(x=>x<=7))return {k:'soon',t:'Due soon ≤7 วัน',i:'⏱',sev:1};
  if(s.aj==='Pass with condition')return {k:'soon',t:'Pass with condition',i:'△',sev:2};
  if(s.aj==='Pass')return {k:'done',t:'Pass',i:'✓',sev:3};
  return {k:'ok',t:'On plan / ตามแผน',i:'●',sev:4};
}
const tagHtml=h=>'<span class="tag '+h.k+'">'+h.i+' '+h.t+'</span>';
function pendChips(s,only){
  const out=[]; DORDER.forEach(k=>{ const a=(s.pd||{})[k]; if(!a||!a.length) return; const over=a.filter(v=>isISO(v)&&diffDays(v)<0).length; if(only&&only!==k) return; out.push('<span class="chip'+(over?' late':'')+'" title="'+esc(DEPT_FULL[k])+' ค้าง '+a.length+(over?' · เลยกำหนด '+over:'')+'">'+k+' '+a.length+(over?' ⚠'+over:'')+'</span>'); });
  return out.join(' ')||'<span class="af">–</span>';
}

function friendly(e){
  const m=String((e&&e.message)||e), s=e&&e.status;
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'ติดต่อ Supabase ไม่ได้ (อินเทอร์เน็ตหลุด หรือเครือข่ายบริษัทบล็อก supabase.co) — ลองกด ↻ อีกครั้ง';
  if(s===402||s===429) return 'Supabase จำกัดโควตา (HTTP '+s+') — ข้อมูลที่แก้ยังอยู่ในหน้านี้ รอแล้วลองบันทึกใหม่ หรือกด “ดาวน์โหลดสำเนา”';

}

function sp(path,val){

  o[last]=val; cur.dirty=true;
}
function fld(path,label,o){
  o=o||{}; const t=o.t||'text', v=gp(path), id='f_'+path.replace(/\W/g,'_'), bad=o.req&&!String(v||'').trim()&&cur.showErr;

  Object.keys(lab).forEach(k=>{ if(JSON.stringify(a[k])!==JSON.stringify(b[k])) out.push(lab[k]+(k==='stage'?' → '+STAGES[b.stage|0]:k==='dmgmJudge'||k==='as'?' → '+(b[k]||'–'):'')); });
  const dp=Object.keys(Object.assign({},a.prep,b.prep)).filter(k=>JSON.stringify((a.prep||{})[k])!==JSON.stringify((b.prep||{})[k])); if(dp.length) out.push('Checklist '+dp.length+' รายการ ('+dp.slice(0,6).join(', ')+(dp.length>6?'…':'')+')');
  [['actions','Action plan'],['mom','MOM'],['risk','Risk'],['links','Link']].forEach(([k,l])=>{ if(JSON.stringify(a[k]||[])!==JSON.stringify(b[k]||[])) out.push(l); });
  if(JSON.stringify(a.review)!==JSON.stringify(b.review)||JSON.stringify(a.sign)!==JSON.stringify(b.sign)) out.push('Review/Sign-off');
  return out.length?out.join(' · ').slice(0,260):'แก้ไขข้อมูล';
}

  cur.saving=true; const bs=[$('bSave'),$('bSave2')]; bs.forEach(b=>{if(b){b.disabled=true;b.textContent='กำลังบันทึก…';}});
  const p=clone(cur.p); (p.log=p.log||[]).push({at:new Date().toISOString(),by:me,what:diffText(cur.base,p)}); if(p.log.length>80) p.log=p.log.slice(-80);

function parseDate(s){
  s=String(s||'').trim(); if(!s) return ''; if(isTBC(s)) return 'T.B.C.'; if(isISO(s)) return s;
  let m=/^(\d{1,2})[-\s]([A-Za-z]{3})[a-z]*[-\s](\d{2,4})$/.exec(s); if(m){const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(mi+1)+'-'+pad(+m[1]);}}
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(s); if(m){const a=+m[1],b=+m[2],y=+m[3]; if(a>12&&b<=12) return y+'-'+pad(b)+'-'+pad(a); if(b>12&&a<=12) return y+'-'+pad(a)+'-'+pad(b); return null;}
  return null;
}

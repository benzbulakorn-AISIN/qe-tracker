<!-- ===== v35 patch : วางทั้งก้อนนี้ไว้ "ก่อน </body>" บรรทัดสุดท้ายของ index.html ===== -->
<style id="u35Style">
/* 1) Main QE Jobs · ช่องรายการ (Line · Topic · Incharge) — กว้างขึ้น เตี้ยลง */
th.u35-item,td.u35-item{width:var(--u35w,420px)!important;min-width:var(--u35w,420px)!important;max-width:var(--u35w,420px)!important;padding-top:6px!important;padding-bottom:6px!important;line-height:1.35!important}
td.u35-item .u35-row{display:flex!important;flex-direction:row!important;flex-wrap:wrap!important;gap:4px!important;align-items:center}
td.u35-item button,td.u35-item .u35-chip{margin-top:2px!important;margin-bottom:2px!important;padding-top:2px!important;padding-bottom:2px!important}
@media (max-width:700px){th.u35-item,td.u35-item{--u35w:270px}}
/* 3) แถบเมนู: คำอธิบายใต้ชื่อแท็บไม่ถูกตัด "…" */
.u35-full{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;max-width:none!important}
</style>
<script id="u35Addon">
(function(){
'use strict';
if(window.__U35) return; window.__U35=true;
const g=id=>document.getElementById(id);

/* ---------- 1) ช่องรายการ Main QE Jobs ---------- */
function fixItemCells(){
  const btns=[...document.querySelectorAll('td button')].filter(b=>/\+\s*กิจกรรม|แก้ไขรายการ/.test(b.textContent));
  if(!btns.length) return;
  const tables=new Set();
  btns.forEach(b=>{
    const td=b.closest('td'); if(!td) return;
    tables.add(td.closest('table'));
    if(td.classList.contains('u35-item')) return;
    td.classList.add('u35-item');
    /* กล่องที่เรียงชิป/ปุ่มเป็นแนวตั้ง → เรียงแนวนอนแล้วขึ้นบรรทัดใหม่เมื่อเต็ม */
    td.querySelectorAll('div,span').forEach(el=>{
      const cs=getComputedStyle(el);
      const kids=[...el.children];
      const chipBox=kids.length>=2&&kids.every(k=>k.tagName==='BUTTON'||k.tagName==='SPAN'||k.tagName==='A'||(k.offsetWidth<260&&k.textContent.trim().length<40));
      if(chipBox&&((cs.display==='flex'&&cs.flexDirection.startsWith('column'))||cs.display==='grid'||cs.display==='block')) el.classList.add('u35-row');
    });
  });
  tables.forEach(t=>{
    if(!t) return;
    const th=[...t.querySelectorAll('thead th')].find(h=>/^\s*รายการ/.test(h.textContent));
    if(th&&!th.classList.contains('u35-item')) th.classList.add('u35-item');
    const col=t.querySelector('colgroup col'); if(col) col.style.width='var(--u35w,420px)';
    /* คอลัมน์ Plan/Actual ที่ตรึงไว้ (sticky) → ขยับตามความกว้างใหม่ */
    const w=(th||t.querySelector('td.u35-item')).offsetWidth;
    t.querySelectorAll('th,td').forEach(c=>{
      if(c.classList.contains('u35-item')) return;
      const cs=getComputedStyle(c);
      if(cs.position==='sticky'&&parseFloat(cs.left)>0&&Math.abs(parseFloat(cs.left)-w)>1) c.style.left=w+'px';
    });
  });
}

/* ---------- 3) ชื่อแท็บด้านบน ---------- */
function navRoot(){ return g('nvNav')||document.querySelector('.tabbar'); }
function walkText(root,fn){ const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; const a=[]; while((n=w.nextNode())) a.push(n); a.forEach(fn); }
function fixNav(){
  const nav=navRoot(); if(!nav) return;
  /* วันนี้ → ภาพรวมวันนี้ (เฉพาะปุ่มแท็บวันนี้) */
  nav.querySelectorAll('button,[role="tab"],a').forEach(b=>{
    const t=b.textContent;
    if(t.indexOf('งานที่ต้องทำวันนี้')>=0||b.id==='tabD'){
      walkText(b,n=>{ if(n.nodeValue.trim()==='วันนี้') n.nodeValue=n.nodeValue.replace('วันนี้','ภาพรวมวันนี้'); });
      if(b.title==='วันนี้') b.title='ภาพรวมวันนี้';
    }
  });
  walkText(nav,n=>{
    const v=n.nodeValue;
    if(v.indexOf('ปัญหา & มาตรการ')>=0) n.nodeValue=v.replace(/ปัญหา\s*&\s*มาตรการ(แก้ไข)?/,'Problem & C/M');
    if(/PCR\s*·\s*Claim/.test(v)&&n.parentElement&&!n.parentElement.classList.contains('u35-full')){
      n.parentElement.classList.add('u35-full');
      if(!/New/.test(v)) n.nodeValue=v.replace(/PCR\s*·\s*Claim.*$/,'PCR · Claim · New');
    }
  });
}

/* ---------- 2) Team Chat: จำว่าอ่านแล้ว (ไม่เด้งเลขซ้ำหลังรีเฟรช) ---------- */
const RK='u35_chat_read';
let latest='', latestList=[];
const meName=()=>{ try{ return String(localStorage.getItem('ux_me')||'').trim(); }catch(e){ return ''; } };
const getRead=()=>{ try{ return localStorage.getItem(RK)||''; }catch(e){ return ''; } };
const setRead=v=>{ try{ if(v&&v>getRead()) localStorage.setItem(RK,v); }catch(e){} };
const panelOpen=()=>{ const p=g('qeChatPanel'); return !!(p&&p.classList.contains('on')); };
const of=window.fetch;
if(of){
  window.fetch=function(input,init){
    const p=of.apply(this,arguments);
    try{
      const url=typeof input==='string'?input:(input&&input.url)||'';
      const m=((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
      if(url.indexOf('/rest/v1/chat_messages')>=0&&m==='GET'){
        p.then(r=>r.clone().json()).then(list=>{
          if(!Array.isArray(list)) return;
          const me=meName();
          latestList=list.filter(x=>x&&x.created_at&&x.sender_name!==me);
          latest=latestList.reduce((a,x)=>x.created_at>a?x.created_at:a,'');
          if(panelOpen()) setRead(latest);
          setTimeout(badge,30);
        }).catch(()=>{});
      }
    }catch(e){}
    return p;
  };
}
let busy=false;
function badge(){
  const b=g('qeChatBadge'); if(!b||busy) return;
  if(panelOpen()){ setRead(latest); }
  const r=getRead();
  const n=latestList.filter(x=>x.created_at>r).length;
  busy=true;
  if(n>0&&!panelOpen()){ b.textContent=String(n); b.classList.add('on'); }
  else { b.classList.remove('on'); b.textContent='0'; }
  busy=false;
}
function hookChat(){
  const b=g('qeChatBadge'), f=g('qeChatFab'), p=g('qeChatPanel');
  if(!b||b.__u35) return; b.__u35=1;
  new MutationObserver(()=>{ if(!busy) setTimeout(badge,0); }).observe(b,{attributes:true,attributeFilter:['class'],childList:true,characterData:true,subtree:true});
  if(p) new MutationObserver(()=>{ if(panelOpen()){ setRead(latest); setTimeout(badge,0); } }).observe(p,{attributes:true,attributeFilter:['class']});
  if(f) f.addEventListener('click',()=>setTimeout(()=>{ setRead(latest); badge(); },50));
  badge();
}

/* ---------- เริ่มทำงาน + ทำซ้ำเมื่อหน้าเปลี่ยน ---------- */
let raf=0;
function run(){ raf=0; try{ fixNav(); }catch(e){} try{ fixItemCells(); }catch(e){} try{ hookChat(); }catch(e){} }
function sched(){ if(!raf) raf=requestAnimationFrame(run); }
function boot(){
  run();
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('resize',()=>{ document.querySelectorAll('.u35-item').forEach(c=>c.classList.remove('u35-item')); sched(); });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
<!-- ===== end v35 patch ===== -->
